<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Pimlico Academy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

#background {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 2s ease-in-out;
}

#background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(11, 28, 45, 0.65);
}

#logo {
    position: fixed;
    inset: 0;
    background: url("school-logo.png") center center no-repeat;
    background-size: 40%;
    opacity: 0.08;
    z-index: 1;
    pointer-events: none;
}

.content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    padding: 40px;
}

.welcome {
    font-size: clamp(28px, 4vw, 60px);
    font-weight: 300;
    letter-spacing: 3px;
    margin-bottom: 25px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.school {
    font-size: clamp(45px, 7vw, 110px);
    font-weight: bold;
    margin-bottom: 40px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.time {
    font-size: clamp(90px, 15vw, 220px);
    font-weight: bold;
    line-height: 1;
    text-shadow: 0 4px 15px rgba(0,0,0,0.6);
}

.date {
    font-size: clamp(24px, 4vw, 50px);
    margin-top: 20px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.6);
}

.footer {
    position: absolute;
    bottom: 30px;
    font-size: clamp(16px, 1.5vw, 24px);
    opacity: 0.9;
}
</style>
</head>

<body>

<div id="background"></div>
<div id="logo"></div>

<div class="content">

    <div class="welcome">WELCOME TO</div>

    <div class="school">
        PIMLICO ACADEMY
    </div>

    <div class="time" id="time">
        00:00:00
    </div>

    <div class="date" id="date">
        Loading...
    </div>

    <div class="footer">
        Excellence • Opportunity • Achievement
    </div>

</div>

<script>

const images = [
    "p1.jpg",
    "p2.jpg"
    "p3.jpg",
    "p4.jpg"
    "p5.jpg",
    "p6.jpg"
];

let currentImage = 0;

function updateBackground() {
    document.getElementById("background").style.backgroundImage =
        `url('${images[currentImage]}')`;

    currentImage = (currentImage + 1) % images.length;
}

function updateClock() {

    const now = new Date();

    const time = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    }).format(now);

    const date = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London',
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
    }).format(now);

    document.getElementById('time').textContent = time;
    document.getElementById('date').textContent = date;
}

updateClock();
updateBackground();

setInterval(updateClock, 1000);
setInterval(updateBackground, 15000);

</script>

</body>
</html>
